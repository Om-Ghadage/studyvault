<!DOCTYPE html>
<html>

<head>

<title>StudyVault</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div id="loader">
<div class="spinner"></div>
</div>

<header>

<div class="logo">StudyVault</div>

<button id="themeToggle">
<i class="fa-solid fa-moon"></i>
</button>

</header>

<section class="hero">

<h1>Discover the Best Student Notes</h1>

<p>Simple. Fast. Beautiful learning platform.</p>

<input type="text" id="searchInput" placeholder="Search subject..." onkeyup="searchNotes()">

</section>

<section class="notes-section">

<div id="notesContainer" class="notes-grid"></div>

</section>

<script src="script.js"></script>

</body>

</html>
