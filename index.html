<!DOCTYPE html>
<html>

<head>

<title>StudyVault</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div id="loader">
<div class="spinner"></div>
</div>

<header>

<div class="nav-left">

<div class="logo">StudyVault</div>

<div class="visitor-count">
<i class="fa-solid fa-eye"></i>
<img src="https://visitor-badge.laobi.icu/badge?page_id=studyvault">
</div>

</div>

<button id="themeToggle">
<i class="fa-solid fa-moon"></i>
</button>

</header>

<section class="hero">

<h1>Discover the Best Student Notes</h1>

<p>Simple. Fast. Modern learning platform.</p>

<input type="text" id="searchInput" placeholder="Search subject..." onkeyup="searchNotes()">

</section>

<section>

<div id="notesContainer" class="notes-grid"></div>

</section>

<footer>

<p>© 2026 StudyVault</p>

</footer>

<script src="script.js"></script>

</body>

</html>
